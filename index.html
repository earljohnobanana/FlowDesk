<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowDesk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="brand">
      <i class="fas fa-cube"></i>
      <span>FlowDesk</span>
    </div>
    <ul class="nav-list">
      <li class="nav-item"><a href="#" class="nav-link active" data-page="dashboard"><i class="fas fa-home"></i><span>Dashboard</span></a></li>
      <li class="nav-item"><a href="#" class="nav-link" data-page="projects"><i class="fas fa-layer-group"></i><span>Projects</span></a></li>
      <li class="nav-item"><a href="#" class="nav-link" data-page="analytics"><i class="fas fa-chart-pie"></i><span>Analytics</span></a></li>
      <li class="nav-item"><a href="#" class="nav-link" data-page="team"><i class="fas fa-users"></i><span>Team</span></a></li>
    </ul>
  </nav>

  <!-- Main content -->
  <main class="main-content">
    <div id="content"></div>
  </main>

  <!-- Project Details Modal -->
  <div class="modal" id="projectDetailModal">
    <div class="modal-content">
      <h2 id="modalTitle">Project Details</h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Add Project Modal -->
  <div class="modal" id="addProjectModal">
    <div class="modal-content">
      <h2>Add New Project</h2>
      <div class="form-group">
        <input type="text" id="newProjectName" placeholder="Project Name" />
      </div>
      <div class="form-group">
        <input type="date" id="newProjectDeadline" />
      </div>
      <div class="form-group">
        <select id="newProjectStatus">
          <option value="ongoing">Ongoing</option>
          <option value="done">Done</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="modal-actions">
        <button onclick="closeModal('projectDetailModal')">Cancel</button>
        <button onclick="saveNewProject()">Add Project</button>
      </div>
    </div>
  </div>

  <!-- Add Team Member Modal -->
  <div class="modal" id="addTeamModal">
    <div class="modal-content">
      <h2>Add Team Member</h2>
      <div class="form-group">
        <input type="text" id="newMemberName" placeholder="Name" />
      </div>
      <div class="form-group">
        <input type="text" id="newMemberRole" placeholder="Role (e.g. Developer)" />
      </div>
      <div class="form-group">
        <input type="email" id="newMemberEmail" placeholder="Email" />
      </div>
      <div class="modal-actions">
        <button onclick="closeModal('projectDetailModal')">Cancel</button>
        <button onclick="saveNewTeamMember()">Add Member</button>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div class="toast" id="toast"></div>

  <!-- JS -->
  <script src="app.js"></script>

</body>
</html>
